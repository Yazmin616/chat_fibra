# nginx.conf — Configuración de proxy inverso para ISP Chatbot CRM
#
# RED LOCAL (sin dominio):
#   server_name _;   y   listen 80;
#   Copia el build del frontend en /var/www/isp-chatbot/frontend/build
#
# CON DOMINIO + SSL:
#   Cambia server_name por tu dominio y descomenta el bloque SSL.
#   Obtén el certificado con: sudo certbot --nginx -d crm.tudominio.com
#
# Activar:
#   sudo ln -s /etc/nginx/sites-available/isp-chatbot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ── Red local (HTTP) ─────────────────────────────────────────────────────────
server {
    listen 8085;
    server_name _;    # acepta cualquier IP / hostname
    client_max_body_size 50M;

    # Frontend React (servido por el contenedor Docker en puerto 3000)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy al backend Node (API REST y archivos subidos en /uploads)
    location ~ ^/(auth|agente|conversaciones|configuracion|contactos|ti|tickets|chat-interno|comunicados|equipos|infracciones|permisos|horarios|transferencia|etiqueta|categoria-cierre|flujo|plantillas-meta|areas-soluciones|palabras-clave|rol-template|telegram|meta|health|uploads) {
        proxy_pass         http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Socket.io — WebSocket para tiempo real
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400;
    }
}

